<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - Back</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @page {
            size: 85mm 55mm;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
        }

        .card {
            width: 85mm;
            height: 55mm;
            background: white;
            border-radius: 8px;
            padding: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Top Accent */
        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3mm;
            background: linear-gradient(90deg, #6B4CE6 0%, #00D9FF 100%);
        }

        .content {
            padding: 8mm 6mm 6mm 6mm;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Contact Info */
        .contact-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 2mm 0;
            font-size: 10px;
            color: #1E1E1E;
        }

        .icon {
            width: 5mm;
            height: 5mm;
            background: linear-gradient(135deg, #6B4CE6 0%, #00D9FF 100%);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 3mm;
            font-size: 8px;
            color: white;
            font-weight: bold;
        }

        .contact-text {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        /* Services Section */
        .services-section {
            border-top: 1px solid #e0e0e0;
            padding-top: 3mm;
        }

        .services-title {
            font-family: 'Poppins', sans-serif;
            font-size: 9px;
            font-weight: 600;
            color: #6B4CE6;
            margin-bottom: 2mm;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .services-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1mm;
        }

        .service-item {
            font-size: 7px;
            color: #4a4a4a;
            display: flex;
            align-items: center;
        }

        .service-item::before {
            content: '•';
            color: #00D9FF;
            font-size: 10px;
            margin-right: 1.5mm;
        }

        /* QR Code Area (placeholder) */
        .qr-area {
            position: absolute;
            bottom: 6mm;
            right: 6mm;
            width: 15mm;
            height: 15mm;
            border: 1px dashed #d0d0d0;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6px;
            color: #999;
            text-align: center;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .card {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-accent"></div>

        <div class="content">
            <div class="contact-section">
                <div class="contact-item">
                    <div class="icon">📧</div>
                    <div class="contact-text">[your.email@neoverse-dts.com]</div>
                </div>

                <div class="contact-item">
                    <div class="icon">📱</div>
                    <div class="contact-text">[+XXX XXX XXX XXXX]</div>
                </div>

                <div class="contact-item">
                    <div class="icon">🌐</div>
                    <div class="contact-text">www.neoverse-dts.com</div>
                </div>

                <div class="contact-item">
                    <div class="icon">📍</div>
                    <div class="contact-text">[Your Address]</div>
                </div>
            </div>

            <div class="services-section">
                <div class="services-title">Our Services</div>
                <div class="services-list">
                    <div class="service-item">Digital Consulting</div>
                    <div class="service-item">FinTech Solutions</div>
                    <div class="service-item">Custom Development</div>
                    <div class="service-item">Strategic Partnerships</div>
                    <div class="service-item">Cybersecurity</div>
                    <div class="service-item">Cloud Integration</div>
                </div>
            </div>
        </div>

        <div class="qr-area">
            QR<br>Code
        </div>
    </div>
</body>
</html>
