<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card - Front</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @page {
            size: 85mm 55mm;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
        }

        .card {
            width: 85mm;
            height: 55mm;
            background: linear-gradient(135deg, #0A2463 0%, #1a3580 50%, #6B4CE6 100%);
            border-radius: 8px;
            padding: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Decorative Background */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,217,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,136,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Digital Grid Pattern */
        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image:
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 10mm 10mm;
        }

        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 6mm;
            color: white;
        }

        /* Logo Area */
        .logo-area {
            margin-bottom: 3mm;
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 1mm;
        }

        .logo-dts {
            font-size: 18px;
            color: #00D9FF;
            margin-left: 2px;
        }

        .tagline {
            font-size: 9px;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Spacer */
        .spacer {
            flex: 1;
        }

        /* Name Area */
        .name-area {
            margin-top: auto;
        }

        .name {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 1mm;
            color: white;
        }

        .title {
            font-size: 11px;
            font-weight: 500;
            color: #00FF88;
            margin-bottom: 0.5mm;
        }

        .division {
            font-size: 9px;
            color: rgba(255,255,255,0.8);
            font-style: italic;
        }

        /* Accent Line */
        .accent-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3mm;
            background: linear-gradient(90deg, #00D9FF 0%, #00FF88 100%);
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .card {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="grid-pattern"></div>
        <div class="content">
            <div class="logo-area">
                <div class="logo-text">
                    Neoverse <span class="logo-dts">DTS</span>
                </div>
                <div class="tagline">Digital Transformation Solutions</div>
            </div>

            <div class="spacer"></div>

            <div class="name-area">
                <div class="name">[Your Name]</div>
                <div class="title">[Your Title]</div>
                <div class="division">Digital Transformation Specialist</div>
            </div>
        </div>
        <div class="accent-line"></div>
    </div>
</body>
</html>
