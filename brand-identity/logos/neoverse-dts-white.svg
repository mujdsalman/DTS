<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Digital Transformation Grid Symbol - White Version -->
  <g id="symbol">
    <!-- Background Grid -->
    <path d="M20 30 L35 20 L50 30 L50 50 L35 60 L20 50 Z" fill="#FFFFFF" opacity="0.3"/>
    <path d="M35 20 L50 10 L65 20 L65 40 L50 50 L35 40 Z" fill="#FFFFFF" opacity="0.5"/>
    <path d="M50 30 L65 20 L80 30 L80 50 L65 60 L50 50 Z" fill="#FFFFFF"/>

    <!-- Forward Arrow Elements -->
    <path d="M65 40 L80 30 L95 40 L95 45 L80 55 L75 52 Z" fill="url(#gradient1-white)"/>
    <path d="M80 30 L95 25 L105 35 L105 40 L95 45 Z" fill="url(#gradient2-white)"/>

    <!-- Connection Lines -->
    <line x1="35" y1="40" x2="80" y2="40" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
    <line x1="50" y1="30" x2="65" y2="20" stroke="#00FF88" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Neoverse Text -->
  <text x="120" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">
    Neoverse
  </text>

  <!-- DTS Text -->
  <text x="310" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#00D9FF">
    DTS
  </text>

  <!-- Tagline -->
  <text x="120" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.8">
    Digital Transformation Solutions
  </text>
</svg>
