<svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Digital Transformation Grid Symbol - Icon Only -->
  <g id="symbol">
    <!-- Background Grid -->
    <path d="M20 30 L40 15 L60 30 L60 55 L40 70 L20 55 Z" fill="#6B4CE6" opacity="0.3"/>
    <path d="M40 15 L60 5 L80 15 L80 45 L60 55 L40 45 Z" fill="#6B4CE6" opacity="0.5"/>
    <path d="M60 30 L80 15 L100 30 L100 55 L80 70 L60 55 Z" fill="#0A2463"/>

    <!-- Forward Arrow Elements -->
    <path d="M80 45 L100 30 L115 42 L115 48 L100 60 L92 55 Z" fill="url(#gradient1)"/>
    <path d="M100 30 L115 24 L125 38 L125 45 L115 48 Z" fill="url(#gradient2)"/>

    <!-- Connection Lines -->
    <line x1="40" y1="45" x2="100" y2="45" stroke="#00D9FF" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="30" x2="80" y2="15" stroke="#00FF88" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B4CE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
